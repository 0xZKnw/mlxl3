[package]
name = "mlxl3-native"
version = "2.0.7"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native Rust/Metal port of MLXL3 (experimental)"

[features]
default = ["mlx"]
direct-metal = ["dep:metal", "dep:objc"]
# MLX uses the Metal device query without enabling the standalone native engine.
mlx = ["dep:metal"]
hybrid-dispatch = ["chat"]
chat = ["dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib", "dep:image", "dep:base64"]

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "mlxl3-rs"
path = "native/src/main.rs"

[[bin]]
name = "mlxl3-hybrid"
path = "native/src/hybrid_main.rs"
required-features = ["hybrid-dispatch"]

[[test]]
name = "contracts"
path = "native/tests/contracts.rs"

[[test]]
name = "runtime_gpu"
path = "native/tests/runtime_gpu.rs"

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
base64 = { version = "0.22", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
libc = "0.2"
signal-hook = "0.3"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokenizers = { version = "0.23.1", optional = true }
minijinja = { version = "2.24", optional = true }
minijinja-contrib = { version = "2.24", features = ["pycompat"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
