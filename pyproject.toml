[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxl3"
version = "1.0.3"
description = "Developer tools for MLXL3 EXL3 conversion on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mlx>=0.32.2",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@44b42cc137763309b0662284ce12d7a95b8c5d99",
  "numpy>=2.0",
  "safetensors>=0.5",
  "certifi>=2025.1.31",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]
bundle = [
  "pyinstaller>=6.16,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlxl3_quantizer*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
