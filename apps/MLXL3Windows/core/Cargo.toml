[package]
name = "mlxl3-windows-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Platform logic of MLXL3 Desktop for Windows: ExLlamaV3 runtimes, engine supervision, GPU detection"
publish = false

# Standalone: not a member of the root mlxl3-native package.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
