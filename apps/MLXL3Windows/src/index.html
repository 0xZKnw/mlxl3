<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLXL3</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <aside id="sidebar">
    <header class="brand">MLXL3 <span id="app-version" class="muted"></span></header>

    <section>
      <h2 data-i18n="engine">Engine</h2>
      <p id="gpu-summary" class="muted" data-i18n="detecting">Detecting GPUs…</p>
      <label><span data-i18n="backend">Backend</span>
        <select id="backend">
          <option value="cuda">NVIDIA · CUDA (native)</option>
          <option value="rocm_wsl">AMD · ROCm (WSL2, experimental)</option>
        </select>
      </label>
      <label id="distro-row" hidden><span data-i18n="distro">WSL2 distribution</span>
        <select id="distro"></select>
      </label>
      <p id="runtime-status" class="muted"></p>
      <button id="install-runtime" data-i18n="install">Install engine runtime</button>
      <progress id="runtime-progress" hidden></progress>
    </section>

    <section class="grow">
      <h2 data-i18n="models">Models</h2>
      <ul id="models"></ul>
      <div class="row">
        <button id="add-model" data-i18n="addFolder">Add folder…</button>
        <button id="unload" data-i18n="unload" disabled>Unload</button>
      </div>
      <details>
        <summary data-i18n="download">Download from Hugging Face</summary>
        <input id="repo" placeholder="turboderp/Qwen3-8B-exl3" spellcheck="false" autocomplete="off">
        <input id="folder" placeholder="4.0bpw (optional subfolder / branch)" spellcheck="false" autocomplete="off">
        <button id="download" data-i18n="downloadBtn">Download</button>
      </details>
      <label><span data-i18n="context">Context (tokens, 0 = auto)</span>
        <input id="context" type="number" min="0" step="256" value="0">
      </label>
    </section>

    <section>
      <details>
        <summary data-i18n="settings">Generation settings</summary>
        <label>System prompt <textarea id="system" rows="3"></textarea></label>
        <label>Temperature <input id="temperature" type="number" min="0" max="5" step="0.05" value="0.6"></label>
        <label>Top-p <input id="top-p" type="number" min="0.01" max="1" step="0.01" value="0.95"></label>
        <label>Top-k <input id="top-k" type="number" min="0" step="1" value="20"></label>
        <label>Min-p <input id="min-p" type="number" min="0" max="0.99" step="0.01" value="0"></label>
        <label>Repetition penalty <input id="rep" type="number" min="0.5" max="3" step="0.01" value="1"></label>
        <label>Max tokens (-1 = auto) <input id="max-tokens" type="number" min="-1" step="1" value="-1"></label>
        <label class="check"><input id="thinking" type="checkbox" checked> <span data-i18n="thinking">Thinking</span></label>
      </details>
      <button id="new-chat" data-i18n="newChat">New conversation</button>
    </section>
  </aside>

  <main>
    <div id="messages" aria-live="polite"></div>
    <form id="composer">
      <textarea id="prompt" rows="2" data-i18n-placeholder="placeholder" placeholder="Message"></textarea>
      <button id="send" type="submit" data-i18n="send">Send</button>
      <button id="stop" type="button" data-i18n="stop" hidden>Stop</button>
    </form>
    <footer id="status"><span id="engine-state" data-i18n="noModel">No model loaded</span><span id="stats"></span></footer>
    <pre id="log" hidden></pre>
  </main>
</body>
</html>
