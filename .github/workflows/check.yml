name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-and-protocol:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MLXL3_SKIP_METAL_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -c packaging/constraints-macos.txt
      - run: python -m compileall -q src
      - run: python -m pytest tests/test_mcp.py tests/test_registry.py tests/test_hub.py -q
      - run: scripts/check-desktop.sh
      # Hosted VMs are not a substitute for physical-Mac Metal validation.
