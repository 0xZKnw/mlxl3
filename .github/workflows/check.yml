name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  native-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_native_coverage.py
      - run: python -m unittest discover -s tests -p test_flash_run_report.py
      - run: python -m unittest discover -s tests -p test_flash_trace_report.py
      - run: python -m pip install numpy==2.5.2 safetensors==0.8.0
      - run: python -m unittest discover -s tests -p test_physical_qwen_gdn.py
      - run: python -m unittest discover -s tests -p test_physical_mapped_expert.py
      - run: python -m unittest discover -s tests -p test_physical_projection_group.py
      - run: python -m py_compile tests/physical_flash_projection.py tests/physical_qwen_gdn.py tests/physical_mapped_expert.py tests/physical_projection_group.py
      - run: python scripts/check_native_coverage.py

  desktop-and-protocol:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MLXL3_SKIP_METAL_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -c packaging/constraints-macos.txt
      - run: scripts/check-e2e.sh
      # Hosted VMs are not a substitute for physical-Mac Metal validation.
