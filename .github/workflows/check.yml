name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  desktop-preferences:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MLXL3_SKIP_METAL_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-desktop.sh --preferences-only

  desktop-and-protocol:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      MLXL3_SKIP_METAL_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -c packaging/constraints-macos.txt
      - name: Check local Desktop test bundle helpers
        run: |
          python -m ruff check scripts/copy-test-runtime.py tests/test_copy_test_runtime.py
          python -m ruff format --check scripts/copy-test-runtime.py tests/test_copy_test_runtime.py
          zsh -n scripts/build-desktop-test.sh
      - run: scripts/check-e2e.sh
      # Hosted VMs are not a substitute for physical-Mac Metal validation.
