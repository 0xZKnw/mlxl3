name: EXL3 conversion contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quantization-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  packing-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC 6.11.0 from the checked release asset
        run: |
          curl --fail --location --max-time 120 https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb --output /tmp/cbmc.deb
          echo 'b3721aa541038384d7801ea3aeabbcddc3e8845ac8f1cbff637cf8dec7481ac8  /tmp/cbmc.deb' | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes /tmp/cbmc.deb
      - name: Verify the shared source under the host address-space model
        run: |
          timeout 180 cbmc -D__CPROVER tests/quantize_packing_proof.cpp --function proof --unwind 17 --unwindset 'proof().0:513' --unwinding-assertions --bounds-check --pointer-check --signed-overflow-check --unsigned-overflow-check
          timeout 180 cbmc -D__CPROVER -DMLXL3_COVER tests/quantize_packing_proof.cpp --function proof --unwind 17 --unwindset 'proof().0:513' --cover assertion --property 'proof().coverage.2' --property 'proof().coverage.3' --property 'proof().coverage.4' --property 'proof().coverage.5' --property 'proof().coverage.6' --property 'proof().coverage.7'
  conversion:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MLXL3_SKIP_METAL_CHECK: '1'
      PYTHONPATH: src:references/PonyExl3:scripts:benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -c packaging/constraints-macos.txt pytest==9.1.1 ruff==0.16.5 crosshair-tool==0.0.101 z3-solver==5.1.0.0
      - name: Apply the pinned optional converter patch
        run: |
          git clone https://github.com/beamivalice/PonyExl3.git references/PonyExl3
          git -C references/PonyExl3 checkout 8e7fa6b1556f59fc669e25087903b279b9b0346f
          git -C references/PonyExl3 apply ../../scripts/patches/ponyexl3-mlxl3-conversion.patch
      - name: Check host contracts and benchmark failure gates
        run: |
          ruff format --check src/mlxl3_quantizer/packing.py scripts/quantize_lfm25_moe.py benchmarks/bench_quantize_packing.py tests/test_lfm25_moe_conversion.py tests/test_quantize_packing.py tests/test_quantize_packing_benchmark.py tests/quantize_conversion_contracts.py tests/test_quantize_k4_boundaries.py tests/test_lfm25_group_profile.py tests/lfm25_profile_contracts.py docs/measurements/quant-lfm25-research-20261013/profile-baseline.py
          ruff check src/mlxl3_quantizer/packing.py scripts/quantize_lfm25_moe.py benchmarks/bench_quantize_packing.py tests/test_lfm25_moe_conversion.py tests/test_quantize_packing.py tests/test_quantize_packing_benchmark.py tests/quantize_conversion_contracts.py tests/test_quantize_k4_boundaries.py tests/test_lfm25_group_profile.py tests/lfm25_profile_contracts.py docs/measurements/quant-lfm25-research-20261013/profile-baseline.py
          python -m compileall -q src/mlxl3_quantizer scripts/quantize_lfm25_moe.py benchmarks/bench_quantize_packing.py docs/measurements/quant-lfm25-research-20261013/profile-baseline.py
          python -m pytest -q tests/test_lfm25_moe_conversion.py tests/test_quantize_packing.py tests/test_quantize_packing_benchmark.py tests/test_lfm_conversion_adapter.py tests/test_quantize_k4_boundaries.py tests/test_lfm25_group_profile.py
          ruff format --check tests/lfm25_calibration_contracts.py
          ruff check tests/lfm25_calibration_contracts.py
          ruff format --check scripts/quantize_lfm25_modal.py tests/test_lfm25_modal.py tests/lfm25_modal_contracts.py
          ruff check scripts/quantize_lfm25_modal.py tests/test_lfm25_modal.py tests/lfm25_modal_contracts.py
          python -m compileall -q scripts/quantize_lfm25_modal.py tests/test_lfm25_modal.py tests/lfm25_modal_contracts.py
          python -m pytest -q tests/test_lfm25_modal.py
      - name: Verify routed CUDA calibration on CPU without cloud credentials
        run: |
          python -m pip install torch==2.10.0
          ruff format --check scripts/exl3_moe_calibration.py scripts/pilot_lfm25_calibration.py scripts/quantize_lfm25_v3_modal.py tests/test_exl3_moe_calibration.py tests/test_lfm25_v3_calibration.py tests/exl3_moe_calibration_contracts.py
          ruff check scripts/exl3_moe_calibration.py scripts/pilot_lfm25_calibration.py scripts/quantize_lfm25_v3_modal.py tests/test_exl3_moe_calibration.py tests/test_lfm25_v3_calibration.py tests/exl3_moe_calibration_contracts.py
          python -m compileall -q scripts/exl3_moe_calibration.py scripts/pilot_lfm25_calibration.py scripts/quantize_lfm25_v3_modal.py
          python -m pytest -q tests/test_exl3_moe_calibration.py tests/test_lfm25_v3_calibration.py
          ruff format --check scripts/generate_lfm25_trace.py benchmarks/eval_lfm25_candidate.py benchmarks/eval_lfm25_quality.py tests/test_lfm25_trace.py tests/test_lfm25_candidate.py tests/test_lfm25_quality.py
          ruff check scripts/generate_lfm25_trace.py benchmarks/eval_lfm25_candidate.py benchmarks/eval_lfm25_quality.py tests/test_lfm25_trace.py tests/test_lfm25_candidate.py tests/test_lfm25_quality.py
          python -m compileall -q scripts/generate_lfm25_trace.py benchmarks/eval_lfm25_candidate.py benchmarks/eval_lfm25_quality.py
          python -m pytest -q tests/test_lfm25_trace.py tests/test_lfm25_candidate.py tests/test_lfm25_quality.py
          ruff format --check docs/measurements/quant-lfm25-v3-20261015/compact-operation.py tests/test_lfm25_compact_operation.py
          ruff check docs/measurements/quant-lfm25-v3-20261015/compact-operation.py tests/test_lfm25_compact_operation.py
          python -m compileall -q docs/measurements/quant-lfm25-v3-20261015/compact-operation.py
          python -m pytest -q tests/test_lfm25_compact_operation.py
          ruff format --check scripts/pilot_lfm25_settings.py scripts/quantize_lfm25_settings_modal.py scripts/convert_lfm25_settings.py tests/test_lfm25_settings.py
          ruff check scripts/pilot_lfm25_settings.py scripts/quantize_lfm25_settings_modal.py scripts/convert_lfm25_settings.py tests/test_lfm25_settings.py
          python -m compileall -q scripts/pilot_lfm25_settings.py scripts/quantize_lfm25_settings_modal.py scripts/convert_lfm25_settings.py
          python -m pytest -q tests/test_lfm25_settings.py
          ruff format --check scripts/diagnose_lfm25_reference.py scripts/diagnose_lfm25_reference_modal.py scripts/diagnose_lfm25_routes.py scripts/diagnose_lfm25_routes_modal.py tests/test_lfm25_reference.py tests/test_lfm25_routes.py
          ruff check scripts/diagnose_lfm25_reference.py scripts/diagnose_lfm25_reference_modal.py scripts/diagnose_lfm25_routes.py scripts/diagnose_lfm25_routes_modal.py tests/test_lfm25_reference.py tests/test_lfm25_routes.py
          python -m compileall -q scripts/diagnose_lfm25_reference.py scripts/diagnose_lfm25_reference_modal.py scripts/diagnose_lfm25_routes.py scripts/diagnose_lfm25_routes_modal.py
          python -m pytest -q tests/test_lfm25_reference.py tests/test_lfm25_routes.py
          ruff format --check scripts/diagnose_lfm25_tuning.py scripts/diagnose_lfm25_tuning_modal.py tests/test_lfm25_tuning.py tests/test_lfm25_tuning_modal.py
          ruff check scripts/diagnose_lfm25_tuning.py scripts/diagnose_lfm25_tuning_modal.py tests/test_lfm25_tuning.py tests/test_lfm25_tuning_modal.py
          python -m compileall -q scripts/diagnose_lfm25_tuning.py scripts/diagnose_lfm25_tuning_modal.py
          python -m pytest -q tests/test_lfm25_tuning.py tests/test_lfm25_tuning_modal.py
      - name: Attempt symbolic expert map isolation (tensor and GPU paths excluded)
        run: |
          crosshair check tests/exl3_moe_calibration_contracts.py --report_all --per_condition_timeout=20
          crosshair check eval_lfm25_quality.scored_count --report_all --per_condition_timeout=20
          crosshair check docs/measurements/quant-lfm25-v3-20261015/compact-operation.py --report_all --per_condition_timeout=20
          crosshair check pilot_lfm25_settings.settings_args --report_all --per_condition_timeout=20
          crosshair check pilot_lfm25_settings.projection_scaled --report_all --per_condition_timeout=20
          crosshair check diagnose_lfm25_reference.valid_token --report_all --per_condition_timeout=20
          crosshair check diagnose_lfm25_routes.checked_position --report_all --per_condition_timeout=20
          crosshair check diagnose_lfm25_tuning.cold_stage --report_all --per_condition_timeout=20
          crosshair check diagnose_lfm25_tuning_modal.cache_name --report_all --per_condition_timeout=20
      - name: Search for counterexamples to the three profile failure guards
        run: |
          mkdir -p build/proofs
          crosshair check tests/lfm25_profile_contracts.py --report_all --per_condition_timeout=20 > build/proofs/profile-crosshair.log 2>&1
          cat build/proofs/profile-crosshair.log
          python -c "from pathlib import Path; text = Path('build/proofs/profile-crosshair.log').read_text(); assert text.count('info: Confirmed over all paths.') == 3, text"
      - name: Search for counterexamples to routed calibration alignment
        run: |
          crosshair check tests/lfm25_calibration_contracts.py --report_all --per_condition_timeout=20 > build/proofs/calibration-crosshair.log 2>&1
          cat build/proofs/calibration-crosshair.log
          python -c "from pathlib import Path; text = Path('build/proofs/calibration-crosshair.log').read_text(); assert text.count('info: Confirmed over all paths.') == 3, text"
      - name: Check CUDA launch contracts without allocating cloud resources
        run: |
          crosshair check tests/lfm25_modal_contracts.py --report_all --per_condition_timeout=20 > build/proofs/modal-crosshair.log 2>&1
          cat build/proofs/modal-crosshair.log
          python -c "from pathlib import Path; text = Path('build/proofs/modal-crosshair.log').read_text(); assert text.count('info: Confirmed over all paths.') == 2, text"
      - name: Check the shared packing source with host sanitizers
        run: |
          mkdir -p build/proofs
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/quantize_packing_proof.cpp -o build/proofs/quantize-packing
          build/proofs/quantize-packing
      # These checks deliberately skip physical Metal tests; local logs record those separately.
