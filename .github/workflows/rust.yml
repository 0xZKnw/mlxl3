name: Native Rust checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kani-flash-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify every compiled Flash CPU harness
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          command: python3 scripts/kani_ci.py
          args: --shard flash --report-dir build/kani-flash
      - name: Preserve each proof verdict and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-flash
          path: build/kani-flash
          if-no-files-found: error

  kani-other-contracts:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [core, speculative, allocator, routes]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify each compiled CPU harness in this shard
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          command: python3 scripts/kani_ci.py
          args: --shard ${{ matrix.shard }} --report-dir build/kani-${{ matrix.shard }}
      - name: Preserve each proof verdict and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-${{ matrix.shard }}
          path: build/kani-${{ matrix.shard }}
          if-no-files-found: error

  # Keep the existing aggregate check name; no failed or missing shard can pass it.
  kani:
    if: always()
    needs: [kani-flash-contracts, kani-other-contracts]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all proof shards
        env:
          FLASH_RESULT: ${{ needs.kani-flash-contracts.result }}
          OTHER_RESULT: ${{ needs.kani-other-contracts.result }}
        run: test "$FLASH_RESULT" = success && test "$OTHER_RESULT" = success

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features chat -- -D warnings
      - run: cargo test --locked --features chat
      - run: cargo build --locked --features chat
      - name: Check Metal cache key ordering and allocation regressions
        run: |
          mkdir -p build/ci
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/kernel_cache_key.cpp -o build/ci/kernel-cache-key
          build/ci/kernel-cache-key
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/kernel_cache_key_proof.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only native/tests/uninitialized_bank_proof.cpp
      - name: Check SSD ranges, actual I/O bytes and failure draining
        if: matrix.os == 'macos-26'
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/disk_reader.cpp -o build/ci/disk-reader
          build/ci/disk-reader
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -I native/ffi native/tests/disk_reader.cpp -o build/ci/disk-reader-tsan
          build/ci/disk-reader-tsan
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/disk_reader_proof.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.5.2 safetensors==0.8.0 ruff==0.16.5
      - name: Check Kani orchestration and process failures
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff format --check scripts/kani_ci.py tests/test_kani_ci.py
          ruff check scripts/kani_ci.py tests/test_kani_ci.py
          python -m pytest -q tests/test_kani_ci.py
      - name: Lint native verification scripts and regressions
        run: |
          for verification_source in docs/measurements/flash-next-ssd-impl/opt-30-les/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-32-les-async/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-33-les-admission/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-34-les-ready/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-38-les-gpu/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-39a-les-lru/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/*/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/*/*supervisor.txt; do
            ruff format --check --stdin-filename flash-les-verification.py < "$verification_source"
            ruff check --select F,E9 --stdin-filename flash-les-verification.py < "$verification_source"
          done
          python < docs/measurements/flash-next-ssd-impl/opt-34-les-ready/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-38-les-gpu/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-39a-les-lru/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/profile/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/components/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/gates/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed-mtp/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/heads/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/heads-les/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed-heads/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/drafts4-quality/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/drafts-speed/guards-supervisor.txt
          for verification_source in docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/quality1/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/calibration-off/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/mutations/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-*/*supervisor.txt; do
            ruff format --check --stdin-filename flash-draft-verification.py < "$verification_source"
            ruff check --select F,E9 --stdin-filename flash-draft-verification.py < "$verification_source"
          done
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/quality1/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/calibration-off/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-off/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-on/guards-supervisor.txt
          ruff format --check --stdin-filename flash-audit45.py < docs/measurements/flash-next-ssd-impl/opt-45-audit-prerequisites/run-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-audit45.py < docs/measurements/flash-next-ssd-impl/opt-45-audit-prerequisites/run-supervisor.txt
          ruff format --check tests/test_flash_quality_run.py
          ruff check tests/test_flash_quality_run.py
          python -m pytest -q tests/test_flash_quality_run.py
          ruff format --check --stdin-filename flash-slot46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/speed-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-slot46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/speed-supervisor.txt
          ruff format --check --stdin-filename flash-bridge46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/bridge-driver.txt
          ruff check --select F,E9 --stdin-filename flash-bridge46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/bridge-driver.txt
          ruff format --check tests/test_flash_slot_benchmark.py
          ruff check tests/test_flash_slot_benchmark.py
          python -m pytest -q tests/test_flash_slot_benchmark.py
          ruff format --check --stdin-filename flash-calibration47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/calibration-bridge.txt
          ruff check --select F,E9 --stdin-filename flash-calibration47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/calibration-bridge.txt
          ruff format --check tests/test_flash_cache_profile.py
          ruff check tests/test_flash_cache_profile.py
          python -m pytest -q tests/test_flash_cache_profile.py
          ruff format --check --stdin-filename flash-cache47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/runtime/speed-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-cache47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/runtime/speed-supervisor.txt
          ruff format --check tests/test_flash_pair_kernel.py
          ruff check tests/test_flash_pair_kernel.py
          python -m pytest -q tests/test_flash_pair_kernel.py
          ruff format --check --stdin-filename flash-pair48.py < docs/measurements/flash-next-ssd-impl/opt-48-paired-experts/qualify-micro.txt
          ruff check --select F,E9 --stdin-filename flash-pair48.py < docs/measurements/flash-next-ssd-impl/opt-48-paired-experts/qualify-micro.txt
          ruff format --check tests/test_flash_resident_gate.py
          ruff check tests/test_flash_resident_gate.py
          python -m pytest -q tests/test_flash_resident_gate.py
          ruff format --check --stdin-filename flash-gate49.py < docs/measurements/flash-next-ssd-impl/opt-49-resident-gates/qualify-micro.txt
          ruff check --select F,E9 --stdin-filename flash-gate49.py < docs/measurements/flash-next-ssd-impl/opt-49-resident-gates/qualify-micro.txt
          ruff format --check tests/test_flash_variance_diagnostic.py
          ruff check tests/test_flash_variance_diagnostic.py
          python -m pytest -q tests/test_flash_variance_diagnostic.py
          ruff format --check --stdin-filename flash-variance49.py < docs/measurements/flash-next-ssd-impl/opt-49-variance-diagnostic/sample-system.txt
          ruff check --select F,E9 --stdin-filename flash-variance49.py < docs/measurements/flash-next-ssd-impl/opt-49-variance-diagnostic/sample-system.txt
          ruff format --check tests/test_flash_larger_cache.py
          ruff check tests/test_flash_larger_cache.py
          python -m pytest -q tests/test_flash_larger_cache.py
          ruff format --check scripts/profile_flash.py tests/test_flash_profile.py tests/test_flash_memory_admission.py
          ruff check scripts/profile_flash.py tests/test_flash_profile.py tests/test_flash_memory_admission.py
          python -m pytest -q tests/test_flash_profile.py tests/test_flash_memory_admission.py
          ruff format --check scripts/analyze_flash_cache_width.py tests/test_flash_cache_width.py
          ruff check scripts/analyze_flash_cache_width.py tests/test_flash_cache_width.py
          python -m py_compile scripts/analyze_flash_cache_width.py
          python -m pytest -q tests/test_flash_cache_width.py
          ruff format --check tests/test_flash_grouped65.py tests/test_flash_monitor_timeout.py docs/measurements/flash-next-ssd-impl/opt-65-grouped-exl3/qualify.py
          ruff check tests/test_flash_grouped65.py tests/test_flash_monitor_timeout.py docs/measurements/flash-next-ssd-impl/opt-65-grouped-exl3/qualify.py
          python -m pytest -q tests/test_flash_grouped65.py tests/test_flash_monitor_timeout.py
          ruff format --check scripts/check_flash_fixed_width.py tests/test_flash_fixed_width.py
          ruff check scripts/check_flash_fixed_width.py tests/test_flash_fixed_width.py
          python -m pytest -q tests/test_flash_fixed_width.py
          ruff format --check scripts/benchmark_flash_modes.py tests/test_flash_modes.py
          ruff check scripts/benchmark_flash_modes.py tests/test_flash_modes.py
          python -m py_compile scripts/benchmark_flash_modes.py
          python -m pytest -q tests/test_flash_modes.py tests/test_flash_benchmark.py
          ruff format --check scripts/summarize_flash_profile.py tests/test_flash_profile_export.py
          ruff check scripts/summarize_flash_profile.py tests/test_flash_profile_export.py
          python -m pytest -q tests/test_flash_profile_export.py
          ruff format --check tests/test_flash_qmv54.py docs/measurements/flash-next-ssd-impl/opt-54-qmv/qualify-micro.py
          ruff check tests/test_flash_qmv54.py docs/measurements/flash-next-ssd-impl/opt-54-qmv/qualify-micro.py
          python -m pytest -q tests/test_flash_qmv54.py
          ruff format --check tests/test_flash_gpu_hot.py
          ruff check tests/test_flash_gpu_hot.py
          python -m pytest -q tests/test_flash_gpu_hot.py
          ruff format --check tests/test_flash_hybrid56.py docs/measurements/flash-next-ssd-impl/opt-56-hybrid-hot/bench.py
          ruff check tests/test_flash_hybrid56.py docs/measurements/flash-next-ssd-impl/opt-56-hybrid-hot/bench.py
          python -m pytest -q tests/test_flash_hybrid56.py
          ruff format --check tests/test_flash_splash60.py docs/measurements/flash-next-ssd-impl/opt-60-splash-dflash/qualify.py
          ruff check tests/test_flash_splash60.py docs/measurements/flash-next-ssd-impl/opt-60-splash-dflash/qualify.py
          python -m pytest -q tests/test_flash_splash60.py
          ruff format --check scripts/replay_flash_cache53.py tests/test_flash_cache53.py
          ruff check scripts/replay_flash_cache53.py tests/test_flash_cache53.py
          python -m pytest -q tests/test_flash_cache53.py
          ruff format --check --stdin-filename flash-cache50.py < docs/measurements/flash-next-ssd-impl/opt-50-larger-cache/bench.txt
          ruff check --select F,E9 --stdin-filename flash-cache50.py < docs/measurements/flash-next-ssd-impl/opt-50-larger-cache/bench.txt
          ruff check --select F,E9 tests/fake-desktop-engine.py
          python -m py_compile tests/fake-desktop-engine.py
          ruff format --check benchmarks/compare_native.py benchmarks/benchmark_smallm.py benchmarks/benchmark_smallm_bridge.py benchmarks/benchmark_smallm_gdn.py benchmarks/benchmark_smallm_inventory.py benchmarks/benchmark_smallm_tensor.py benchmarks/benchmark_decode_tiles.py benchmarks/benchmark_gdn_norm_gate.py native/check_qmm_tiles.py scripts/native_json_process.py tests/test_compare_native.py tests/test_qmm_tiles.py tests/test_native_json_process.py tests/test_smallm_benchmark.py tests/test_decode_microbenchmarks.py
          ruff check benchmarks/compare_native.py benchmarks/benchmark_smallm.py benchmarks/benchmark_smallm_bridge.py benchmarks/benchmark_smallm_gdn.py benchmarks/benchmark_smallm_inventory.py benchmarks/benchmark_smallm_tensor.py benchmarks/benchmark_decode_tiles.py benchmarks/benchmark_gdn_norm_gate.py native/check_qmm_tiles.py scripts/native_json_process.py tests/test_compare_native.py tests/test_qmm_tiles.py tests/test_native_json_process.py tests/test_smallm_benchmark.py tests/test_decode_microbenchmarks.py
          python -m py_compile benchmarks/compare_native.py benchmarks/benchmark_smallm.py benchmarks/benchmark_smallm_bridge.py benchmarks/benchmark_smallm_gdn.py benchmarks/benchmark_smallm_inventory.py benchmarks/benchmark_smallm_tensor.py benchmarks/benchmark_decode_tiles.py benchmarks/benchmark_gdn_norm_gate.py native/check_qmm_tiles.py scripts/native_json_process.py
          ruff format --check scripts/check-mtp-model-switch.py scripts/check-mtp-reference.py scripts/package_engine.py tests/test_mtp_model_switch.py tests/test_package_engine.py
          ruff check scripts/check-mtp-model-switch.py scripts/check-mtp-reference.py scripts/package_engine.py tests/test_mtp_model_switch.py tests/test_package_engine.py
          python -m py_compile scripts/check-mtp-model-switch.py scripts/check-mtp-reference.py scripts/package_engine.py
          ruff format --check scripts/experimental-draft-head.py tests/test_experimental_draft_head.py
          ruff check scripts/experimental-draft-head.py tests/test_experimental_draft_head.py
          python -m py_compile scripts/experimental-draft-head.py
          ruff format --check scripts/check_dflash2.py tests/test_dflash2_check.py
          ruff check scripts/check_dflash2.py tests/test_dflash2_check.py
          python -m py_compile scripts/check_dflash2.py
          ruff format --check scripts/check_flash_drafts.py tests/test_flash_drafts.py
          ruff check scripts/check_flash_drafts.py tests/test_flash_drafts.py
          ruff format --check scripts/calibrate_flash_draft.py tests/test_flash_calibration.py
          ruff check scripts/calibrate_flash_draft.py tests/test_flash_calibration.py
          python -m pytest -q tests/test_flash_calibration.py
          python -m py_compile scripts/check_flash_drafts.py
      - name: Check bridge and QMM validation tools
        run: python -m pytest -q tests/test_bridge_benchmark.py tests/test_package_engine.py tests/test_qmm_tiles.py tests/test_compare_native.py tests/test_native_json_process.py tests/test_mtp_model_switch.py tests/test_smallm_benchmark.py tests/test_decode_microbenchmarks.py tests/test_experimental_draft_head.py tests/test_dflash2_check.py tests/test_flash_drafts.py tests/test_flash_reference.py tests/test_flash_benchmark.py tests/test_mtp_bridge.py
      - name: Check process memory report analyzer (CPU only)
        run: |
          ruff format --check scripts/analyze_flash_process_memory.py tests/test_flash_process_memory.py
          ruff check scripts/analyze_flash_process_memory.py tests/test_flash_process_memory.py
          python -m py_compile scripts/analyze_flash_process_memory.py
          python -m pytest -q tests/test_flash_process_memory.py
      - name: Check factorial small-M profile and promotion gates
        run: |
          ruff format --check benchmarks/analyze_smallm_profile.py benchmarks/benchmark_smallm_reuse.py tests/test_smallm_profile.py tests/test_smallm_reuse.py
          ruff check benchmarks/analyze_smallm_profile.py benchmarks/benchmark_smallm_reuse.py tests/test_smallm_profile.py tests/test_smallm_reuse.py
          python -m pytest -q tests/test_smallm_profile.py tests/test_smallm_reuse.py
      - name: Check LFM2.5 quality evaluator and subprocess failures
        run: |
          ruff format --check benchmarks/eval_lfm25_quality.py tests/test_lfm25_quality.py
          ruff check benchmarks/eval_lfm25_quality.py tests/test_lfm25_quality.py
          python -m py_compile benchmarks/eval_lfm25_quality.py
          python -m pytest -q tests/test_lfm25_quality.py
      - name: Check idle-memory benchmark failure and parity gates
        run: |
          ruff format --check scripts/benchmark-flash-bridge.py tests/test_flash_benchmark.py
          ruff check scripts/benchmark-flash-bridge.py tests/test_flash_benchmark.py
          ruff format --check benchmarks/benchmark_flash_memory.py tests/test_flash_memory.py
          ruff check benchmarks/benchmark_flash_memory.py tests/test_flash_memory.py
          python -m pytest -q tests/test_flash_memory.py
          ruff format --check benchmarks/benchmark_idle_memory.py tests/test_idle_memory_benchmark.py docs/measurements/memory-saver/check-transitions.py
          ruff check benchmarks/benchmark_idle_memory.py tests/test_idle_memory_benchmark.py docs/measurements/memory-saver/check-transitions.py
          python -m pytest -q tests/test_idle_memory_benchmark.py
          ruff format --check docs/measurements/adaptive-memory-20261009/bridge-boundaries-capture.py
          ruff check docs/measurements/adaptive-memory-20261009/bridge-boundaries-capture.py
          python -m py_compile docs/measurements/adaptive-memory-20261009/bridge-boundaries-capture.py
          ruff format --check docs/measurements/tune-feedback-20261010/diagnose-tune.py
          ruff check docs/measurements/tune-feedback-20261010/diagnose-tune.py
          python docs/measurements/tune-feedback-20261010/diagnose-tune.py --self-test
      - name: Check process-memory encoding against the Apple SDK without a GPU
        if: matrix.os == 'macos-26'
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined native/tests/process_memory.cpp -o build/ci/process-memory
          build/ci/process-memory
      - name: Compile and lint the shipped MLX bridge
        if: matrix.os == 'macos-26'
        run: |
          python -m pip install mlx==0.32.2
          mlxl3_mlx_root="$(python -c 'import importlib.util; print(next(iter(importlib.util.find_spec("mlx").submodule_search_locations)))')"
          export MLXL3_MLX_ROOT="$mlxl3_mlx_root"
          cargo clippy --locked --all-targets --features mlx,chat -- -D warnings
          cargo build --locked --release --features mlx,chat
          cargo test --locked --lib --features mlx,chat qwen4::draft::raw_draft_reader_does_not_require_exl3_metadata_and_rejects_foreign_config -- --exact | tee build/ci/raw-draft-reader.log
          python -c 'from pathlib import Path; assert "test result: ok. 1 passed; 0 failed;" in Path("build/ci/raw-draft-reader.log").read_text()'
          set -euo pipefail
          for test_name in memory_stats_decode_keeps_zero_valid_and_preserves_all_fields memory_stats_ffi_rejects_short_and_null_outputs_before_gpu_work; do
            cargo test --locked --lib --features mlx,chat "array::tests::$test_name" -- --exact --test-threads=1 | tee "build/ci/$test_name.log"
            python -c 'import sys; from pathlib import Path; assert "test result: ok. 1 passed; 0 failed;" in Path(sys.argv[1]).read_text()' "build/ci/$test_name.log"
          done
      - name: Check LFM prefill CPU oracles against the MLX-feature source
        if: matrix.os == 'macos-26'
        shell: bash
        run: |
          mlxl3_mlx_root="$(python -c 'import importlib.util; print(next(iter(importlib.util.find_spec("mlx").submodule_search_locations)))')"
          export MLXL3_MLX_ROOT="$mlxl3_mlx_root"
          lfm_cpu_tests=(
            route_canonicalization_matches_independent_token_layer_fixture
            route_canonicalization_rejects_incomplete_rows_and_counts
            route_capture_refuses_bad_shapes_dtypes_ids_and_nonfinite_scores
            a_valid_route_order_mutation_is_detected_by_the_fixture_oracle
            route_trace_scope_refuses_nesting_and_restores_after_error
            prefill_counters_require_real_grouped_execution
            microblock_eligibility_requires_v2_config_and_every_mapped_projection
          )
          for lfm_cpu_test in "${lfm_cpu_tests[@]}"; do
            lfm_cpu_output="$(cargo test --locked --lib --features mlx,chat "lfm2::prefill_tests::$lfm_cpu_test" -- --exact)"
            printf '%s\n' "$lfm_cpu_output"
            [[ "$lfm_cpu_output" == *"1 passed; 0 failed; 0 ignored;"* ]]
          done
      - name: Check EXL3 lane layout CPU state and Tune key
        if: matrix.os == 'macos-26'
        shell: bash
        run: |
          mlxl3_mlx_root="$(python -c 'import importlib.util; print(next(iter(importlib.util.find_spec("mlx").submodule_search_locations)))')"
          export MLXL3_MLX_ROOT="$mlxl3_mlx_root"
