name: Native Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust safety contracts with Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: --lib --no-default-features

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features chat -- -D warnings
      - run: cargo test --locked --features chat
      - run: cargo build --locked --features chat
      - name: Check CPU-only feature configuration
        run: |
          cargo clippy --locked --all-targets --no-default-features --features chat -- -D warnings
          cargo test --locked --no-default-features --features chat
      # Physical Apple GPU tests remain explicitly #[ignore]. Hosted jobs do
      # not enable the optional mlx feature, which needs a supplied libmlx.
