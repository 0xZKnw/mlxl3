name: Native Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MLXL3_NATIVE_BINARY: ${{ github.workspace }}/target/debug/mlxl3-rs
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features chat -- -D warnings
      - run: cargo test --locked --features chat
      - run: cargo build --locked --features chat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - name: Compare CPU codec with Python reference
        run: python native/check_parity.py --binary "$MLXL3_NATIVE_BINARY"
      - name: Compare streamed reasoning fragments
        run: python -m pytest -q native/test_streaming_parity.py native/test_kernel_sources.py
      # Physical Apple GPU tests remain explicitly #[ignore]. Hosted jobs do
      # not enable the optional mlx feature, which needs a supplied libmlx.
