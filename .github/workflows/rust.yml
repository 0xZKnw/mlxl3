name: Native Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kani-flash-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Flash offsets, partition and greedy commits independently
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: >-
            --lib --no-default-features
            --harness pair_commit_preserves_exact_valid_prefix_without_overflow
            --harness tensor_source_interval_is_ordered_and_cannot_wrap
            --harness reference_partition
            --harness mtp_depth_one_commits_only_target_tokens_inside_budgets
            --harness mtp_all_depths_commit_target_prefix_within_budgets
            --harness greedy_acceptance_is_the_maximal_matching_prefix
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust safety contracts with Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: --lib --no-default-features

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features chat -- -D warnings
      - run: cargo test --locked --features chat
      - run: cargo build --locked --features chat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.2.6
      - name: Check bridge benchmark mode validation
        run: python -m pytest -q tests/test_bridge_benchmark.py tests/test_package_engine.py tests/test_flash_reference.py tests/test_flash_benchmark.py tests/test_mtp_bridge.py
      # Physical Apple GPU tests remain explicitly #[ignore]. Hosted jobs do
      # not enable the optional mlx feature, which needs a supplied libmlx.
