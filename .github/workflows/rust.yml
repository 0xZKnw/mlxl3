name: Native Rust checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kani-flash-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify every compiled Flash CPU harness
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          command: python3 scripts/kani_ci.py
          args: --shard flash --report-dir build/kani-flash
      - name: Preserve each proof verdict and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-flash
          path: build/kani-flash
          if-no-files-found: error

  kani-other-contracts:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [core, speculative, allocator, routes]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify each compiled CPU harness in this shard
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          command: python3 scripts/kani_ci.py
          args: --shard ${{ matrix.shard }} --report-dir build/kani-${{ matrix.shard }}
      - name: Verify test-only profiling and cache aging contracts
        if: always() && matrix.shard == 'core'
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          command: cargo kani
          args: >-
            --lib --tests --no-default-features -Z stubbing --jobs 1 --output-format terse
            --harness global_frequency_aging_matches_wide_arithmetic_for_all_counters
            --harness flash_profile::readback_profile_accepts_exactly_valid_bounded_durations
            --harness flash_profile::stage_retention_restores_symbolic_nested_scopes
            --harness flash_profile::cross_layer_ancestry_checks_actual_two_event_parent_guards
      - name: Preserve each proof verdict and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-${{ matrix.shard }}
          path: build/kani-${{ matrix.shard }}
          if-no-files-found: error

  # Keep the existing aggregate check name; no failed or missing shard can pass it.
  kani:
    if: always()
    needs: [kani-flash-contracts, kani-other-contracts]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all proof shards
        env:
          FLASH_RESULT: ${{ needs.kani-flash-contracts.result }}
          OTHER_RESULT: ${{ needs.kani-other-contracts.result }}
        run: test "$FLASH_RESULT" = success && test "$OTHER_RESULT" = success

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Match the shipped macOS deployment target
        if: matrix.os == 'macos-26'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=26.2' >> "$GITHUB_ENV"
      - name: Compile the direct Metal shaders without a GPU
        if: matrix.os == 'macos-26'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -c native/shaders/exl3.metal -o "$RUNNER_TEMP/exl3.air"
          xcrun -sdk macosx metal -c native/shaders/exl3.metal -DMLXL3_AR33_CODEWORD_TABLE=1 -o "$RUNNER_TEMP/exl3-codeword-table.air"
          xcrun -sdk macosx metal -c native/shaders/exl3.metal -DMLXL3_DEVICE_RESIDENT_ROUTE=1 -DMLXL3_AR20_TESTS=1 -DMLXL3_AR30_COOPERATIVE=0 -o "$RUNNER_TEMP/exl3-device-hot.air"
          xcrun -sdk macosx metal -c native/shaders/qwen_gdn.metal -o "$RUNNER_TEMP/qwen-gdn.air" -DHIDDEN=2048 -DKEY_HEADS=16 -DVALUE_HEADS=32 -DKEY_DIM=128 -DVALUE_DIM=128 -DKEYS=2048 -DCONV_DIMS=8192 -DCONV_LENGTH=4 -DCONV_HISTORY=3
          xcrun -sdk macosx metal -c native/shaders/qwen_mtp_affine.metal -o "$RUNNER_TEMP/qwen-mtp-affine.air"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features chat -- -D warnings
      - run: cargo test --locked --features chat
      - run: cargo build --locked --features chat
      - name: Check Metal cache key ordering and allocation regressions
        run: |
          mkdir -p build/ci
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/metal_os_capabilities.cpp -o build/ci/metal-os-capabilities
          build/ci/metal-os-capabilities
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/kernel_cache_key.cpp -o build/ci/kernel-cache-key
          build/ci/kernel-cache-key
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/kernel_cache_key_proof.cpp
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only native/tests/uninitialized_bank_proof.cpp
      - name: Check SSD ranges, actual I/O bytes and failure draining
        if: matrix.os == 'macos-26'
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/disk_reader.cpp -o build/ci/disk-reader
          build/ci/disk-reader
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -I native/ffi native/tests/disk_reader.cpp -o build/ci/disk-reader-tsan
          build/ci/disk-reader-tsan
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/disk_reader_proof.cpp
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I native/ffi native/tests/disk_reader_async.cpp -o build/ci/disk-reader-async
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 build/ci/disk-reader-async
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -I native/ffi native/tests/disk_reader_async.cpp -o build/ci/disk-reader-async-tsan
          TSAN_OPTIONS=halt_on_error=1 build/ci/disk-reader-async-tsan
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/disk_reader_async_proof.cpp
      - name: Check bounded SSD work assignment under address and undefined sanitizers
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -I native/ffi native/tests/disk_work_queue.cpp -o build/ci/disk-work-queue
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 build/ci/disk-work-queue
          c++ -std=c++17 -Wall -Wextra -Werror -I native/ffi -fsyntax-only native/tests/disk_work_queue_proof.cpp
      - name: Check bounded SSD work assignment under the thread sanitizer
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread -I native/ffi native/tests/disk_work_queue.cpp -o build/ci/disk-work-queue-tsan
          TSAN_OPTIONS=halt_on_error=1 build/ci/disk-work-queue-tsan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.5.2 safetensors==0.8.0 ruff==0.16.5
      - name: Replay the shared pool against the exact historical cache trace (CPU only)
        env:
          MLXL3_POOL_TRACE: docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/calibration-trace.json
          MLXL3_POOL_REPORT: build/ci/shared-pool.json
        run: |
          set -euo pipefail
          cargo test --locked --lib --features chat flash_cache_profile::shared::replay_exact_calibration_with_shared_slots -- --exact --ignored --test-threads=1 | tee build/ci/shared-pool.log
          python3 -c 'from pathlib import Path; assert "1 passed; 0 failed; 0 ignored;" in Path("build/ci/shared-pool.log").read_text()'
          python3 -c 'import json; from pathlib import Path; r=json.loads(Path("build/ci/shared-pool.json").read_text()); assert r["status"]=="complete_simulation_not_speed" and r["baseline_counts"]=="exact_both_phases_all_layers" and r["confirmed_tps_gain"] is False and len(r["cases"])==4'
      - name: Compare shared policies and ARC against reconstructed physical AR traces (CPU only)
        env:
          MLXL3_CURRENT_POOL_CAPTURE: docs/measurements/issue58-20261029/current-capture.json
        run: |
          set -euo pipefail
          MLXL3_CURRENT_POOL_REPORT=build/ci/current-pool.json cargo test --locked --release --lib --features chat flash_cache_profile::shared::current::current_ar_traces_reconstruct_exact_cache_before_pool_scoring -- --exact --ignored --test-threads=1 | tee build/ci/current-pool.log
          MLXL3_CURRENT_POOL_REPORT=build/ci/arc-pool.json cargo test --locked --release --lib --features chat flash_cache_profile::shared::current::current_ar_traces_compare_arc_after_exact_physical_reconstruction -- --exact --ignored --test-threads=1 | tee build/ci/arc-pool.log
          python3 -c 'from pathlib import Path; assert all("1 passed; 0 failed; 0 ignored;" in Path("build/ci/"+p+"-pool.log").read_text() for p in ["current","arc"])'
          python3 -c 'import json; from pathlib import Path; reports=[json.loads(Path("build/ci/"+p+"-pool.json").read_text()) for p in ["current","arc"]]; assert all(r["status"]=="complete_simulation_not_speed" and r["baseline_counts_and_every_slot_hit"]=="exact_all_three_phases_both_prompts" and r["confirmed_tps_gain"] is False and r["total_slots"]==2544 for r in reports); assert len(reports[0]["variants"])==5 and len(reports[1]["cases"])==2'
      - name: Check Kani orchestration and process failures
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff format --check scripts/kani_ci.py tests/test_kani_ci.py
          ruff check scripts/kani_ci.py tests/test_kani_ci.py
          python -m pytest -q tests/test_kani_ci.py
      - name: Lint native verification scripts and regressions
        run: |
          ruff format --check tests/test_flash_draft_supervisor.py
          ruff check tests/test_flash_draft_supervisor.py
          python -m pytest -q tests/test_flash_draft_supervisor.py
          ruff format --check tests/physical_model_ops.py tests/test_physical_model_ops.py
          ruff check tests/physical_model_ops.py tests/test_physical_model_ops.py
          python -m pytest -q tests/test_physical_model_ops.py
          ruff format --check tests/physical_qwen_bridge.py tests/test_physical_qwen_bridge.py
          ruff check tests/physical_qwen_bridge.py tests/test_physical_qwen_bridge.py
          python -m pytest -q tests/test_physical_qwen_bridge.py
          ruff format --check tests/test_flash_shared_pool.py
          ruff check tests/test_flash_shared_pool.py
          ruff format --check docs/measurements/issue58-20261029/pool-speed-driver.py tests/test_flash_pool_driver.py
          ruff check docs/measurements/issue58-20261029/pool-speed-driver.py tests/test_flash_pool_driver.py
          ruff format --check --stdin-filename extract-current.py < docs/measurements/issue58-20261029/extract-current.txt
          ruff check --select F,E9 --stdin-filename extract-current.py < docs/measurements/issue58-20261029/extract-current.txt
          python -m pytest -q tests/test_flash_shared_pool.py
          python -m pytest -q tests/test_flash_pool_driver.py
          for verification_source in docs/measurements/flash-next-ssd-impl/opt-30-les/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-32-les-async/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-33-les-admission/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-34-les-ready/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-38-les-gpu/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-39a-les-lru/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/*/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/*/*supervisor.txt; do
            ruff format --check --stdin-filename flash-les-verification.py < "$verification_source"
            ruff check --select F,E9 --stdin-filename flash-les-verification.py < "$verification_source"
          done
          python < docs/measurements/flash-next-ssd-impl/opt-34-les-ready/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-38-les-gpu/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-39a-les-lru/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-41-les-critical-path/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/profile/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/components/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/gates/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed-mtp/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/heads/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/heads-les/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/speed-heads/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/drafts4-quality/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-43-mtp-route-head/drafts-speed/guards-supervisor.txt
          for verification_source in docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/quality1/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/calibration-off/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/mutations/*supervisor.txt docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-*/*supervisor.txt; do
            ruff format --check --stdin-filename flash-draft-verification.py < "$verification_source"
            ruff check --select F,E9 --stdin-filename flash-draft-verification.py < "$verification_source"
          done
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/quality1/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/calibration-off/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-off/guards-supervisor.txt
          python < docs/measurements/flash-next-ssd-impl/opt-44-draft-scheduler/speed-on/guards-supervisor.txt
          ruff format --check --stdin-filename flash-audit45.py < docs/measurements/flash-next-ssd-impl/opt-45-audit-prerequisites/run-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-audit45.py < docs/measurements/flash-next-ssd-impl/opt-45-audit-prerequisites/run-supervisor.txt
          ruff format --check tests/test_flash_quality_run.py
          ruff check tests/test_flash_quality_run.py
          python -m pytest -q tests/test_flash_quality_run.py
          ruff format --check --stdin-filename flash-slot46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/speed-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-slot46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/speed-supervisor.txt
          ruff format --check --stdin-filename flash-bridge46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/bridge-driver.txt
          ruff check --select F,E9 --stdin-filename flash-bridge46.py < docs/measurements/flash-next-ssd-impl/opt-46-slot-nt2/speed-final/bridge-driver.txt
          ruff format --check tests/test_flash_slot_benchmark.py
          ruff check tests/test_flash_slot_benchmark.py
          python -m pytest -q tests/test_flash_slot_benchmark.py
          ruff format --check --stdin-filename flash-calibration47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/calibration-bridge.txt
          ruff check --select F,E9 --stdin-filename flash-calibration47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/calibration-bridge.txt
          ruff format --check tests/test_flash_cache_profile.py
          ruff check tests/test_flash_cache_profile.py
          python -m pytest -q tests/test_flash_cache_profile.py
          ruff format --check --stdin-filename flash-cache47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/runtime/speed-supervisor.txt
          ruff check --select F,E9 --stdin-filename flash-cache47.py < docs/measurements/flash-next-ssd-impl/opt-47-layer-cache/runtime/speed-supervisor.txt
          ruff format --check tests/test_flash_pair_kernel.py
          ruff check tests/test_flash_pair_kernel.py
          python -m pytest -q tests/test_flash_pair_kernel.py
          ruff format --check --stdin-filename flash-pair48.py < docs/measurements/flash-next-ssd-impl/opt-48-paired-experts/qualify-micro.txt
          ruff check --select F,E9 --stdin-filename flash-pair48.py < docs/measurements/flash-next-ssd-impl/opt-48-paired-experts/qualify-micro.txt
          ruff format --check tests/test_flash_resident_gate.py
          ruff check tests/test_flash_resident_gate.py
          python -m pytest -q tests/test_flash_resident_gate.py
          ruff format --check --stdin-filename flash-gate49.py < docs/measurements/flash-next-ssd-impl/opt-49-resident-gates/qualify-micro.txt
          ruff check --select F,E9 --stdin-filename flash-gate49.py < docs/measurements/flash-next-ssd-impl/opt-49-resident-gates/qualify-micro.txt
          ruff format --check tests/test_flash_variance_diagnostic.py
          ruff check tests/test_flash_variance_diagnostic.py
          python -m pytest -q tests/test_flash_variance_diagnostic.py
          ruff format --check --stdin-filename flash-variance49.py < docs/measurements/flash-next-ssd-impl/opt-49-variance-diagnostic/sample-system.txt
          ruff check --select F,E9 --stdin-filename flash-variance49.py < docs/measurements/flash-next-ssd-impl/opt-49-variance-diagnostic/sample-system.txt
          ruff format --check tests/test_flash_larger_cache.py
          ruff check tests/test_flash_larger_cache.py
          python -m pytest -q tests/test_flash_larger_cache.py
          ruff format --check scripts/profile_flash.py tests/test_flash_profile.py tests/test_flash_memory_admission.py docs/measurements/decode-profile-20261031/capture.py tests/test_decode_capture.py
          ruff check scripts/profile_flash.py tests/test_flash_profile.py tests/test_flash_memory_admission.py docs/measurements/decode-profile-20261031/capture.py tests/test_decode_capture.py
          python -m py_compile docs/measurements/decode-profile-20261031/capture.py
          python -m pytest -q tests/test_flash_profile.py tests/test_flash_memory_admission.py tests/test_decode_capture.py
          ruff format --check tests/test_cold_schedule_diagnostic.py
          ruff check tests/test_cold_schedule_diagnostic.py
          python -m pytest -q tests/test_cold_schedule_diagnostic.py
          ruff check docs/measurements/decode-profile-p09-20261101/run.py docs/measurements/decode-profile-p09-20261101/run-mtp-head.py tests/test_decode_profile_p09.py
          python -m pytest -q tests/test_decode_profile_p09.py
          ruff check docs/measurements/decode-profile-p09-20261101/analyze.py tests/test_decode_p09_attribution.py
          python docs/measurements/decode-profile-p09-20261101/analyze.py --self-check
          python -m pytest -q tests/test_decode_p09_attribution.py
          ruff format --check docs/measurements/post-p08-dense-epilogue-20261031/benchmark-inspection.py docs/measurements/post-p08-dense-epilogue-20261031/inspection_selftest.py docs/measurements/post-p08-dense-epilogue-20261031/bounded-gpu-runner.py docs/measurements/post-p08-dense-epilogue-20261031/bounded_guard_selftest.py
          ruff check docs/measurements/post-p08-dense-epilogue-20261031/benchmark-inspection.py docs/measurements/post-p08-dense-epilogue-20261031/inspection_selftest.py docs/measurements/post-p08-dense-epilogue-20261031/bounded-gpu-runner.py docs/measurements/post-p08-dense-epilogue-20261031/bounded_guard_selftest.py
          python -m py_compile docs/measurements/post-p08-dense-epilogue-20261031/benchmark-inspection.py docs/measurements/post-p08-dense-epilogue-20261031/inspection_selftest.py docs/measurements/post-p08-dense-epilogue-20261031/bounded-gpu-runner.py docs/measurements/post-p08-dense-epilogue-20261031/bounded_guard_selftest.py
          python docs/measurements/post-p08-dense-epilogue-20261031/inspection_selftest.py
          python -m pytest -q docs/measurements/post-p08-dense-epilogue-20261031/bounded_guard_selftest.py
          ruff format --check docs/measurements/post-p08-compose-20261101/benchmark-inspection.py docs/measurements/post-p08-compose-20261101/inspection_selftest.py
          ruff check docs/measurements/post-p08-compose-20261101/benchmark-inspection.py docs/measurements/post-p08-compose-20261101/inspection_selftest.py
          python -m py_compile docs/measurements/post-p08-compose-20261101/benchmark-inspection.py docs/measurements/post-p08-compose-20261101/inspection_selftest.py
          python docs/measurements/post-p08-compose-20261101/inspection_selftest.py
          ruff format --check docs/measurements/post-p08-cold-ready-20261101/readiness.py
          ruff check docs/measurements/post-p08-cold-ready-20261101/readiness.py
          python -m py_compile docs/measurements/post-p08-cold-ready-20261101/readiness.py
          python docs/measurements/post-p08-cold-ready-20261101/readiness.py --self-check
          ruff format --check docs/measurements/post-p08-cold-ready-20261101/gpu-runner.py docs/measurements/post-p08-cold-ready-20261101/gpu_runner_selftest.py
          ruff check docs/measurements/post-p08-cold-ready-20261101/gpu-runner.py docs/measurements/post-p08-cold-ready-20261101/gpu_runner_selftest.py
          python -m py_compile docs/measurements/post-p08-cold-ready-20261101/gpu-runner.py docs/measurements/post-p08-cold-ready-20261101/gpu_runner_selftest.py
          python -m pytest -q docs/measurements/post-p08-cold-ready-20261101/gpu_runner_selftest.py
          ruff format --check docs/measurements/post-p08-cold-ready-20261101/gpu-diagnostic-runner.py
          ruff check docs/measurements/post-p08-cold-ready-20261101/gpu-diagnostic-runner.py
          python -m py_compile docs/measurements/post-p08-cold-ready-20261101/gpu-diagnostic-runner.py
          python docs/measurements/post-p08-cold-ready-20261101/gpu-diagnostic-runner.py --self-check
