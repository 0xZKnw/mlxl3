name: Flash profile compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 ruff==0.16.5 numpy==2.5.4 crosshair-tool==0.0.101 z3-solver==5.3.3.0
      - name: Check profiler formatting and regressions
        run: |
          ruff format --check scripts/profile_flash.py scripts/summarize_flash_profile.py tests/test_cold_schedule_diagnostic.py tests/cold_legacy_contracts.py
          ruff check scripts/profile_flash.py scripts/summarize_flash_profile.py tests/test_cold_schedule_diagnostic.py tests/cold_legacy_contracts.py
          python -m pytest -q tests/test_cold_schedule_diagnostic.py tests/test_flash_profile.py tests/test_flash_profile_export.py
      - name: Check historical counters against the actual Python validators
        run: |
          mkdir -p build/proofs
          crosshair check tests/cold_legacy_contracts.py --report_all --per_condition_timeout=20 > build/proofs/cold-legacy.log 2>&1
          cat build/proofs/cold-legacy.log
          python -c "from pathlib import Path; text = Path('build/proofs/cold-legacy.log').read_text(); assert text.count('info: Confirmed over all paths.') == 2, text"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-legacy-proof
          path: build/proofs
